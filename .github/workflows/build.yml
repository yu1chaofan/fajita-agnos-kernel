name: Build AGNOS Kernel for OnePlus 6T (fajita)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo'
        required: false
        default: 'https://github.com/LineageOS/android_kernel_oneplus_sdm845.git'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'lineage-22.2'
      defconfig:
        description: 'Defconfig'
        required: false
        default: 'enchilada_defconfig'
      variant:
        description: 'Variant (perf / empty)'
        required: false
        default: 'perf'
  push:
    branches: [ main ]
    paths: [ '.github/workflows/**', 'patches/**' ]

permissions:
  contents: write

jobs:
  build:
    # 原生 arm64 runner：内核是 arm64，不需要交叉编译，公开仓库免费
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "arch: $(uname -m)"; nproc; free -h | head -2; df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            ccache rsync cpio kmod lz4 zstd git
          gcc --version | head -1

      - name: Clone kernel source (shallow)
        env:
          KREPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/LineageOS/android_kernel_oneplus_sdm845.git' }}
          KBRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}
        run: |
          set -e
          echo "cloning $KREPO @ $KBRANCH"
          git clone --depth 1 -b "$KBRANCH" "$KREPO" kernel
          cd kernel
          echo "commit: $(git rev-parse HEAD)"
          echo "version: $(head -4 Makefile | tr '\n' ' ')"
          du -sh .

      - name: Apply local patches
        run: |
          set -e
          if [ -d "patches" ] && [ -n "$(ls -A patches 2>/dev/null)" ]; then
            cd kernel
            for p in ../patches/*.patch; do
              [ -f "$p" ] || continue
              echo "== applying $(basename $p)"
              git apply -v "$p" || patch -p1 < "$p"
            done
            cd ..
            echo "patches applied"
          else
            echo "no patches"
          fi

      - name: Configure
        id: cfg
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'enchilada_defconfig' }}
          VARIANT: ${{ github.event.inputs.variant || 'perf' }}
        run: |
          set -e
          cd kernel
          mkdir -p out
          echo "=== available defconfigs ==="
          ls arch/arm64/configs/ | grep -E "sdm845|enchilada|fajita" || true
          make O=out ARCH=arm64 "$DEFCONFIG"
          FRAG="arch/arm64/configs/vendor/sdm845-${VARIANT}_defconfig"
          if [ -n "$VARIANT" ] && [ -f "$FRAG" ]; then
            echo "=== merge $FRAG ==="
            cat "$FRAG" >> out/.config
          fi
          # AGNOS 必需项（强制写回，防止 olddefconfig 关闭）
          for opt in \
            CONFIG_ANDROID=y \
            CONFIG_ANDROID_BINDER_IPC=y \
            CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y \
            CONFIG_IKCONFIG=y \
            CONFIG_IKCONFIG_PROC=y \
            CONFIG_USB_CONFIGFS=y \
            CONFIG_USB_CONFIGFS_NCM=y \
            CONFIG_USB_CONFIGFS_F_FS=y \
            CONFIG_SECURITY_SELINUX=y \
            CONFIG_EXT4_FS=y \
            CONFIG_SCSI_UFS_QCOM=y ; do
            key="${opt%%=*}"
            sed -i "/^${key}[= ]/d" out/.config
            echo "$opt" >> out/.config
          done
          make O=out ARCH=arm64 olddefconfig
          echo "config ready"

      - name: Verify critical configs
        run: |
          set -e
          cd kernel
          MISS=0
          for opt in \
            CONFIG_ANDROID CONFIG_ANDROID_BINDER_IPC \
            CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE CONFIG_IKCONFIG_PROC \
            CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_NCM \
            CONFIG_SPECTRA_CAMERA CONFIG_MSM_CAMCC_SDM845 \
            CONFIG_TOUCHSCREEN_SYNAPTICS_DSX_CORE \
            CONFIG_MSM_DISPCC_SDM845 CONFIG_SCSI_UFS_QCOM CONFIG_EXT4_FS ; do
            if grep -q "^${opt}=y" out/.config; then echo "  OK   $opt"; else echo "  MISS $opt"; MISS=$((MISS+1)); fi
          done
          echo "missing=$MISS"
          [ $MISS -le 3 ] || { echo "::error::too many missing"; exit 1; }

      - name: Build kernel
        run: |
          set -e
          cd kernel
          echo "=== building with $(nproc) jobs ==="
          make O=out ARCH=arm64 -j$(nproc) Image.gz-dtb 2>&1 | tail -60

      - name: Build device tree blobs
        continue-on-error: true
        run: |
          cd kernel
          make O=out ARCH=arm64 -j$(nproc) dtbs 2>&1 | tail -30

      - name: Package
        run: |
          set -e
          mkdir -p out-artifacts
          cd kernel
          ls -lh arch/arm64/boot/ 2>/dev/null || true
          for f in Image.gz-dtb Image.gz Image; do
            [ -f "out/arch/arm64/boot/$f" ] && cp "out/arch/arm64/boot/$f" ../out-artifacts/ && echo "packed $f"
          done
          find out -name "*fajita*.dtbo" -exec cp {} ../out-artifacts/ \; 2>/dev/null || true
          cp out/.config ../out-artifacts/kernel.config
          cd ..
          echo "=== artifacts ==="
          ls -lh out-artifacts/
          sha256sum out-artifacts/* > out-artifacts/SHA256SUMS.txt
          cat out-artifacts/SHA256SUMS.txt
          echo "kernel_commit=$(cd kernel && git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fajita-kernel-${{ github.run_number }}
          path: out-artifacts/
          retention-days: 30
