name: Build AGNOS Kernel for OnePlus 6T (fajita)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo'
        required: false
        default: 'https://github.com/LineageOS/android_kernel_oneplus_sdm845.git'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'lineage-22.2'
      defconfig:
        description: 'Defconfig'
        required: false
        default: 'enchilada_defconfig'
      variant:
        description: 'Variant (perf / empty)'
        required: false
        default: 'perf'
  push:
    branches: [ main ]
    paths: [ '.github/workflows/**', 'patches/**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "arch: $(uname -m)"; nproc; free -h | head -2; df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            ccache rsync cpio kmod lz4 zstd git clang lld llvm
          echo "gcc:  $(gcc --version | head -1)"
          echo "clang: $(clang --version | head -1)"

      - name: Clone kernel source
        env:
          KREPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/LineageOS/android_kernel_oneplus_sdm845.git' }}
          KBRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}
        run: |
          set -e
          git clone --depth 1 -b "$KBRANCH" "$KREPO" kernel
          cd kernel
          echo "commit: $(git rev-parse HEAD)"
          head -4 Makefile

      - name: Apply local patches
        run: |
          set -e
          cd kernel
          if ls ../patches/*.patch >/dev/null 2>&1; then
            for p in ../patches/*.patch; do
              echo "== $(basename $p)"
              git apply -v "$p" || patch -p1 < "$p"
            done
          else
            echo "no patches"
          fi

      - name: Configure
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'enchilada_defconfig' }}
          VARIANT: ${{ github.event.inputs.variant || 'perf' }}
        run: |
          set -e
          cd kernel
          mkdir -p out
          make O=out ARCH=arm64 "$DEFCONFIG"
          FRAG="arch/arm64/configs/vendor/sdm845-${VARIANT}_defconfig"
          if [ -n "$VARIANT" ] && [ -f "$FRAG" ]; then
            cat "$FRAG" >> out/.config
          fi
          printf '%s\n' \
            'CONFIG_ANDROID=y' \
            'CONFIG_ANDROID_BINDER_IPC=y' \
            'CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y' \
            'CONFIG_IKCONFIG=y' \
            'CONFIG_IKCONFIG_PROC=y' \
            'CONFIG_USB_CONFIGFS=y' \
            'CONFIG_USB_CONFIGFS_NCM=y' \
            'CONFIG_USB_CONFIGFS_F_FS=y' \
            'CONFIG_SECURITY_SELINUX=y' \
            'CONFIG_EXT4_FS=y' \
            'CONFIG_SCSI_UFS_QCOM=y' \
            '# CONFIG_CC_WERROR is not set' \
            '# CONFIG_WERROR is not set' >> out/.config
          make O=out ARCH=arm64 olddefconfig
          grep -E "^CONFIG_(CC_)?WERROR" out/.config || echo "WERROR disabled OK (both names)"

      - name: Verify critical configs
        run: |
          set -e
          cd kernel
          MISS=0
          for opt in CONFIG_ANDROID CONFIG_ANDROID_BINDER_IPC CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE CONFIG_IKCONFIG_PROC CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_NCM CONFIG_SPECTRA_CAMERA CONFIG_MSM_CAMCC_SDM845 CONFIG_TOUCHSCREEN_SYNAPTICS_DSX_CORE CONFIG_MSM_DISPCC_SDM845 CONFIG_SCSI_UFS_QCOM CONFIG_EXT4_FS ; do
            if grep -q "^${opt}=y" out/.config; then echo "  OK   $opt"; else echo "  MISS $opt"; MISS=$((MISS+1)); fi
          done
          echo "missing=$MISS"
          test $MISS -le 3 || { echo "::error::too many missing configs"; exit 1; }

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel
          set +e
          make O=out ARCH=arm64 -j$(nproc) KCFLAGS='-Wno-error' Image.gz-dtb > /tmp/build.log 2>&1
          RC=$?
          set -e
          echo "make exit code: $RC"
          if [ $RC -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            echo "--- real compiler errors (grep 'error:' only) ---"
            grep -nE "error:|fatal error|undefined reference" /tmp/build.log | head -30 || echo "(no error: lines)"
            echo "--- context around first failing dir ---"
            FIRST_FAIL=$(grep -nE "\*\*\* .*Error 1" /tmp/build.log | head -1 | cut -d: -f1)
            if [ -n "$FIRST_FAIL" ]; then
              START=$((FIRST_FAIL > 25 ? FIRST_FAIL - 25 : 1))
              sed -n "${START},${FIRST_FAIL}p" /tmp/build.log
            fi
            echo "--- last 30 lines ---"
            tail -30 /tmp/build.log
            echo "--- full log uploaded as artifact for inspection ---"
            cp /tmp/build.log "$GITHUB_WORKSPACE/build-failed.log" || true
            exit 1
          fi
          echo "=== build ok ==="
          tail -20 /tmp/build.log

      - name: Build device tree blobs
        continue-on-error: true
        run: |
          cd kernel
          make O=out ARCH=arm64 -j$(nproc) dtbs > /tmp/dtbs.log 2>&1 || tail -30 /tmp/dtbs.log

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out-artifacts
          cd kernel
          ls -lh out/arch/arm64/boot/ || true
          FOUND=""
          for f in Image.gz-dtb Image.gz Image; do
            if [ -f "out/arch/arm64/boot/$f" ]; then
              cp "out/arch/arm64/boot/$f" ../out-artifacts/
              echo "packed $f"
              FOUND="$f"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::no kernel image produced"
            exit 1
          fi
          find out -name "*fajita*.dtbo" -exec cp {} ../out-artifacts/ \; 2>/dev/null || true
          cp out/.config ../out-artifacts/kernel.config
          cd ..
          SIZE=$(stat -c%s out-artifacts/$FOUND)
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::kernel image too small ($SIZE bytes)"
            exit 1
          fi
          ls -lh out-artifacts/
          sha256sum out-artifacts/* > out-artifacts/SHA256SUMS.txt
          cat out-artifacts/SHA256SUMS.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-failed.log
          retention-days: 7

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fajita-kernel-${{ github.run_number }}
          path: out-artifacts/
          retention-days: 30
